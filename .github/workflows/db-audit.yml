name: Database Audit

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggers

jobs:
  db-audit:
    name: Run Database Audit
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: infysight_users
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/infysight_users
        run: |
          # Run Alembic migrations to set up schema
          alembic upgrade head
      
      - name: Run database audit
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/infysight_users
        run: |
          chmod +x scripts/db_audit.sh
          scripts/db_audit.sh
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-audit-report-${{ github.run_number }}
          path: reports/db-audit/audit_*.txt
          retention-days: 90
      
      - name: Check for critical issues
        run: |
          # Parse the audit report for critical issues
          REPORT_FILE=$(ls -t reports/db-audit/audit_*.txt | head -1)
          
          if grep -q "⚠️  WARNING" "$REPORT_FILE"; then
            echo "::warning::Database audit found issues. Check the artifact for details."
            
            # Extract summary
            echo "## Database Audit Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -A 5 "⚠️  WARNING" "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY || true
          else
            echo "✓ Database audit passed with no issues"
            echo "## Database Audit Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✓ All checks passed successfully" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Database Audit Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `The scheduled database audit workflow failed.
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please review the audit report artifact for details.
            
            **Auto-generated by:** .github/workflows/db-audit.yml`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['database', 'audit', 'automated']
            });
