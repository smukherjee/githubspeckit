[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "githubspeckit-backend"
version = "0.1.0"
description = "Modern enterprise-grade multi-tenant FastAPI backend (hexagonal, auth core, observability, quality gates)."
authors = [ { name = "githubspeckit" } ]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
keywords = ["fastapi", "multi-tenant", "rbac", "observability", "argon2", "opentelemetry"]

# Core runtime dependencies (minimal pins with upper bounds for forward safety)
# Pins are intentionally ranged; a fully pinned requirements.txt will be generated via `uv export`.
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "tenacity>=8.2.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi==0.58b0",
    "opentelemetry-instrumentation-sqlalchemy==0.58b0",
    "pillow>=11.0.0",
    "python-magic>=0.4.27",
    "argon2-cffi>=23.1.0",
    "redis>=6.4.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    "email-validator>=2.0.0",
    "greenlet>=3.0.0",
    "tomli>=2.0.0",
    "python-json-logger>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
email = ["aiosmtplib>=2.0,<3"]
# Future extras (e.g., search, messaging) can be appended here.

# Development & quality tooling
[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=1.2.0",
  "hypothesis>=6.100,<7",
  "coverage>=7.5,<8",
  "ruff>=0.13.2",
  "mypy>=1.10,<2",
  "types-redis>=4.6,<5",
  "safety>=3.1,<4",
  "radon>=6.0,<7",
  "xenon>=0.9,<1",  # complexity enforcement wrapper for radon
  "pyyaml>=6.0.3,<7",
  # jscpd duplication tool typically via node; consider container stage if needed
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["build/"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "PERF", "Q", "S", "C90"]
ignore = ["S101"]

target-version = "py312"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.xenon]
max-absolute = "C"
max-modules = "B"
max-average = "B"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
# Point to actual bootstrap module under src/cli
app-bootstrap = "cli.bootstrap:main"

# Documentation for dependency workflow
[tool.project-notes]
workflow = "Use uv for locking (uv lock) then export portable pinned requirements: `uv export --all-extras --no-dev --format requirements-txt > requirements.txt`; dev lock: `uv export --all-extras --format requirements-txt > requirements-dev.txt`"
