openapi: 3.0.3
info:
  title: Admin API Endpoints
  description: Backend API endpoints for administrative operations in multi-tenant system. Frontend-agnostic APIs supporting any client framework.
  version: 1.0.0
  contact:
    name: Backend API Team
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1 base path (admin endpoints)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Core Entity Schemas
    Tenant:
      type: object
      required: [tenant_id, name, is_active, created_at, updated_at, created_by, updated_by]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Unique tenant identifier
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Organization name
        is_active:
          type: boolean
          description: Tenant activation status
        settings:
          type: object
          properties:
            max_users:
              type: integer
              minimum: 1
              nullable: true
            features:
              type: array
              items:
                type: string
            branding:
              type: object
              properties:
                logo_url:
                  type: string
                  format: uri
                primary_color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                secondary_color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    User:
      type: object
      required: [user_id, tenant_id, email, is_disabled, failed_login_attempts, roles, created_at, updated_at, created_by, updated_by]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Unique within tenant
        is_disabled:
          type: boolean
        failed_login_attempts:
          type: integer
          minimum: 0
        last_login_at:
          type: string
          format: date-time
          nullable: true
        full_name:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA timezone identifier
          nullable: true
        language:
          type: string
          description: ISO 639-1 language code
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum: [superadmin, tenant_admin, developer, analyst, user, service_account, support_readonly]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    Policy:
      type: object
      required: [policy_id, tenant_id, name, resource, action, effect, roles, priority, is_active, created_at, updated_at, created_by, updated_by]
      properties:
        policy_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique within tenant
        resource:
          type: string
          description: Resource type (users, tenants, policies, etc.)
        action:
          type: string
          description: Action type (create, read, update, delete)
        conditions:
          type: object
          properties:
            resource_owner:
              type: boolean
            same_tenant:
              type: boolean
            custom_rules:
              type: object
        effect:
          type: string
          enum: [ALLOW, DENY]
        roles:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    FeatureFlag:
      type: object
      required: [flag_id, name, is_enabled, created_at, updated_at, created_by, updated_by]
      properties:
        flag_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: null for global flags
        name:
          type: string
          description: Unique within tenant scope
        is_enabled:
          type: boolean
        description:
          type: string
          nullable: true
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        target_users:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid

    Invitation:
      type: object
      required: [invitation_id, tenant_id, email, roles, invited_by, status, expires_at, invitation_token, created_at, updated_at]
      properties:
        invitation_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        invited_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_by:
          type: string
          format: uuid
          nullable: true
        invitation_token:
          type: string
          description: Secure token for invitation acceptance
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required: [event_id, event_type, resource_type, resource_id, actor_type, action, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: null for system events
        event_type:
          type: string
          description: Dot notation (e.g., user.created, policy.updated)
        resource_type:
          type: string
        resource_id:
          type: string
        actor_id:
          type: string
          format: uuid
          nullable: true
        actor_type:
          type: string
          enum: [user, system]
        action:
          type: string
        changes:
          type: object
          properties:
            before:
              type: object
            after:
              type: object
        metadata:
          type: object
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time

    # Request/Response Schemas
    ListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0

    SingleResponse:
      type: object
      required: [data]
      properties:
        data: {}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: object

    # Create/Update Request Schemas
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
          default: true
        settings:
          type: object

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
        settings:
          type: object

    CreateUserRequest:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
        job_title:
          type: string
        department:
          type: string
        phone:
          type: string
        timezone:
          type: string
        language:
          type: string
        roles:
          type: array
          items:
            type: string
        is_disabled:
          type: boolean
          default: false
        password:
          type: string
          minLength: 8
          description: Optional - if not provided, invitation will be sent

    UpdateUserRequest:
      type: object
      description: |
        Update core user fields (email, roles, status).
        
        Note: Extended profile fields (full_name, job_title, department, phone, timezone, language)
        are managed in the user_details table (feature 003-user-profile-details) and should be
        updated via PUT /api/v1/users/{user_id}/profile endpoint.
      properties:
        email:
          type: string
          format: email
          description: User email address (must be unique within tenant)
        roles:
          type: array
          items:
            type: string
          description: User roles (superadmin assignment requires superadmin permission)
        is_disabled:
          type: boolean
          description: Account disabled status

    CreatePolicyRequest:
      type: object
      required: [name, resource, action, effect, roles]
      properties:
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        conditions:
          type: object
        effect:
          type: string
          enum: [ALLOW, DENY]
        roles:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
        is_active:
          type: boolean
          default: true

    CreateFeatureFlagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tenant_id:
          type: string
          format: uuid
          nullable: true
        is_enabled:
          type: boolean
          default: false
        description:
          type: string
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
        target_users:
          type: array
          items:
            type: string
            format: uuid

    CreateInvitationRequest:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 72

  parameters:
    TenantIdQuery:
      name: tenant_id
      in: query
      description: Filter by tenant ID (required for superadmin cross-tenant operations)
      schema:
        type: string
        format: uuid

    PageQuery:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageQuery:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    SortQuery:
      name: sort
      in: query
      description: Sort field
      schema:
        type: string
        default: created_at

    OrderQuery:
      name: order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc

paths:
  # Tenant Management Endpoints
  /tenants:
    get:
      summary: List tenants
      description: List all tenants (superadmin) or current tenant (tenant_admin)
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/OrderQuery'
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create tenant
      description: Create a new tenant (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (non-superadmin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tenants/{tenant_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get tenant by ID
      description: Get specific tenant details
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update tenant
      description: Update tenant details (superadmin or tenant_admin for own tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'

    delete:
      summary: Delete tenant
      description: Delete tenant (superadmin only)
      responses:
        '204':
          description: Tenant deleted
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # User Management Endpoints
  /users:
    get:
      summary: List users
      description: List users within authorized scope (tenant-filtered for non-superadmin)
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/OrderQuery'
        - name: role
          in: query
          description: Filter by role
          schema:
            type: string
        - name: is_disabled
          in: query
          description: Filter by status
          schema:
            type: boolean
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'

    post:
      summary: Create user
      description: Create a new user within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get user by ID
      description: Get specific user details within authorized scope
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

    put:
      summary: Update user
      description: Update user details within authorized scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

    delete:
      summary: Delete user
      description: Delete user within authorized scope (soft delete - sets status to disabled)
      responses:
        '204':
          description: User deleted

  /users/{user_id}/reset-password:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Reset user password (admin-initiated)
      description: |
        Admin-initiated password reset without requiring current password verification.
        
        Authorization:
        - Tenant admins can reset passwords for users in their tenant
        - Superadmins can reset passwords for any user
        - Only superadmins can reset superadmin passwords
        
        Note: This is different from self-service password change which requires current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
                  description: New password (must meet strength requirements)
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: string
                    format: uuid
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{user_id}/restore:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Restore disabled user
      description: Restore a soft-deleted (disabled) user account within authorized scope
      responses:
        '200':
          description: User restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  status:
                    type: string
        '400':
          description: User is not disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Policy Management Endpoints
  /policies:
    get:
      summary: List policies
      description: List policies within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - name: resource
          in: query
          description: Filter by resource type
          schema:
            type: string
        - name: effect
          in: query
          description: Filter by policy effect
          schema:
            type: string
            enum: [ALLOW, DENY]
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Policy'

    post:
      summary: Create policy
      description: Create a new policy within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Policy'

  # Feature Flag Management Endpoints
  /feature-flags:
    get:
      summary: List feature flags
      description: List feature flags within authorized scope (global + tenant-specific)
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - name: is_enabled
          in: query
          description: Filter by enabled status
          schema:
            type: boolean
      responses:
        '200':
          description: List of feature flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FeatureFlag'

    post:
      summary: Create feature flag
      description: Create a new feature flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlagRequest'
      responses:
        '201':
          description: Feature flag created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FeatureFlag'

  # Invitation Management Endpoints
  /invitations:
    get:
      summary: List invitations
      description: List invitations within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - name: status
          in: query
          description: Filter by invitation status
          schema:
            type: string
            enum: [pending, accepted, expired, revoked]
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invitation'

    post:
      summary: Create invitation
      description: Create a new user invitation within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'

  /invitations/{invitation_id}/revoke:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Revoke invitation
      description: Revoke a pending invitation
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'

  # Audit Log Endpoints
  /audit-events:
    get:
      summary: List audit events
      description: List audit events within authorized scope with filtering
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - name: event_type
          in: query
          description: Filter by event type
          schema:
            type: string
        - name: resource_type
          in: query
          description: Filter by resource type
          schema:
            type: string
        - name: actor_id
          in: query
          description: Filter by actor ID
          schema:
            type: string
            format: uuid
        - name: from_date
          in: query
          description: Filter events from date
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          description: Filter events to date
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEvent'

  /audit-events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get audit event by ID
      description: Get specific audit event details within authorized scope
      responses:
        '200':
          description: Audit event details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SingleResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditEvent'

  # Bulk Operations
  /users/bulk/export:
    post:
      summary: Export users to CSV
      description: Export users within authorized scope to CSV format
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                fields:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /users/bulk/import:
    post:
      summary: Import users from CSV
      description: Bulk import users from CSV within authorized tenant scope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with user data
                dry_run:
                  type: boolean
                  default: false
                  description: Validate only, don't create users
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_rows:
                    type: integer
                  successful:
                    type: integer
                  failed:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                        message:
                          type: string