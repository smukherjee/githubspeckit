openapi: 3.1.0
info:
  title: Auth & Policy API (Fragment)
  version: 0.1.0-draft
  description: >-
    Fragment for authentication (login, refresh, password reset) and policy management.
    Duplicates of shared components (securitySchemes, TokenResponse, Policy) intentionally removed.
    These are provided by the base fragment during combination.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        mfa_code: { type: string, minLength: 6, maxLength: 10, nullable: true }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [reset_token, new_password]
      properties:
        reset_token: { type: string }
        new_password: { type: string, minLength: 12 }
        mfa_code: { type: string, nullable: true }
    PolicyUpsertRequest:
      type: object
      required: [resource_type, effect]
      properties:
        resource_type: { type: string }
        condition_expression: { type: string }
        effect: { type: string, enum: [ALLOW, DENY] }
paths:
  /auth/login:
    post:
      summary: Primary authentication endpoint (with optional MFA inline)
      tags: [Auth]
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '400': { description: Malformed request }
        '401': { description: Invalid credentials or MFA required }
        '429': { description: Too many failed attempts (rate limited) }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: New tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '400': { description: Malformed request }
        '401': { description: Invalid or revoked refresh token }
        '429': { description: Rate limited }
  /auth/password/reset:
    post:
      summary: Initiate password reset
      tags: [Password]
      operationId: passwordResetInitiate
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } }
      responses:
        '202': { description: Reset email dispatched (always 202 to avoid user enumeration) }
        '429': { description: Rate limited }
  /auth/password/confirm:
    post:
      summary: Complete password reset
      tags: [Password]
      operationId: passwordResetConfirm
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } }
      responses:
        '200': { description: Password updated }
        '400': { description: Invalid or expired token }
        '401': { description: Auth context required if policy demands re-auth }
  /policies:
    get:
      summary: List policies (latest versions)
      tags: [Policy]
      operationId: policiesList
      parameters:
        - name: resource_type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      summary: Create or new version a policy (idempotent by same spec hash)
      tags: [Policy]
      operationId: policyUpsert
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PolicyUpsertRequest' } }
      responses:
        '201': { description: Policy created }
        '200': { description: Existing identical policy reused }
        '400': { description: Validation failure }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /policies/{policy_id}:
    get:
      summary: Retrieve a policy (latest version)
      tags: [Policy]
      operationId: policyGet
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not Found }
  /policies/{policy_id}/versions:
    get:
      summary: List versions for a policy
      tags: [Policy]
      operationId: policyVersionsList
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Versions listed }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not Found }
