openapi: 3.1.0
info:
  title: Modern Multi-Tenant Backend API
  version: 0.1.0-draft
  description: >-
    Core fragment providing canonical shared components (securitySchemes, common schemas,
    error & pagination models) plus core domain endpoints: tenants, users, auth token,
    embed exchange, audit events. Other fragments (auth-policy, observability) rely on
    these definitions during combination – avoid duplicating shared elements there.
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local Dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
      description: Tenant context identifier
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size (default 50, max 200)
  schemas:
    RoleName:
      type: string
      description: "Role identifier (hierarchical precedence: superadmin > tenant_admin > member)"
      enum: [superadmin, tenant_admin, member]
    Tenant:
      type: object
      required: [tenant_id, name, status, created_at]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, soft_deleted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    User:
      type: object
      required: [user_id, tenant_id, email, status]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [invited, active, disabled] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleName' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    InviteUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
          description: Optional initial roles (must be subset allowed for inviter)
    InviteUserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        invitation_token_expires_at: { type: string, format: date-time }
    Policy:
      type: object
      required: [policy_id, version, resource_type, effect, created_at]
      properties:
        policy_id: { type: string, format: uuid }
        version: { type: integer }
        resource_type: { type: string }
        condition_expression: { type: string }
        effect: { type: string, enum: [ALLOW, DENY] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid, nullable: true }
    AuditEvent:
      type: object
      required: [event_id, action_type, created_at]
      properties:
        event_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, nullable: true }
        actor_user_id: { type: string, format: uuid, nullable: true }
        action_type: { type: string }
        target_ref: { type: string, nullable: true }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
    FeatureFlag:
      type: object
      required: [flag_key, status]
      properties:
        flag_key: { type: string }
        tenant_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [enabled, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    EmbedTokenExchangeRequest:
      type: object
      required: [embed_token]
      properties:
        embed_token: { type: string }
    EmbedSession:
      type: object
      required: [session_id, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        roles:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
    PaginationMeta:
      type: object
      required: [limit]
      properties:
        cursor: { type: string, nullable: true }
        next_cursor: { type: string, nullable: true }
        prev_cursor: { type: string, nullable: true }
        limit: { type: integer }
        total_estimate: { type: integer, nullable: true, description: Optional approximate total (may be omitted for performance) }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, nullable: true }
        trace_id: { type: string, nullable: true }
        docs_url: { type: string, format: uri, nullable: true }
    TokenResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        token_type: { type: string, example: Bearer }
    AuditEventPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    TenantCollection:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    UserCollection:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
  responses:
    StandardError:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Caller lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (e.g., duplicate name)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds until next allowed request
          schema: { type: integer }
        RateLimit-Limit:
          description: Total number of requests allowed in the current window
          schema: { type: integer }
        RateLimit-Remaining:
          description: Remaining requests in the current window
          schema: { type: integer }
        RateLimit-Reset:
          description: UTC epoch seconds when the current window resets
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /tenants:
    get:
      summary: List tenants (superadmin only)
      tags: [Tenants]
      operationId: tenantsList
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, soft_deleted] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create tenant
      tags: [Tenants]
      operationId: tenantCreate
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tenants/{tenant_id}:
    get:
      summary: Get tenant
      tags: [Tenants]
      operationId: tenantGet
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update tenant (rename or status changes)
      tags: [Tenants]
      operationId: tenantUpdate
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft delete tenant
      tags: [Tenants]
      operationId: tenantDelete
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Soft deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant_id}/restore:
    post:
      summary: Restore soft-deleted tenant
      tags: [Tenants]
      operationId: tenantRestore
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      summary: List users for tenant
      tags: [Users]
      operationId: usersList
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: email
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [invited, active, disabled] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserCollection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Invite user to tenant
      tags: [Users]
      operationId: userInvite
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201': { description: Invitation created, content: { application/json: { schema: { $ref: '#/components/schemas/InviteUserResponse' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me:
    get:
      summary: Get current user's profile
      tags: [Users]
      operationId: userGetMe
      description: Returns the profile of the currently authenticated user
      responses:
        '200': 
          description: Current user profile
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{user_id}:
    get:
      summary: Get user
      tags: [Users]
      operationId: userGet
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update user roles or status (disable/activate)
      tags: [Users]
      operationId: userUpdate
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Disable user (idempotent)
      tags: [Users]
      operationId: userDisable
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{user_id}/restore:
    post:
      summary: Restore disabled user
      tags: [Users]
      operationId: userRestore
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/token:
    post:
      summary: Issue auth token
      tags: [Auth]
      operationId: authTokenIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Token issued, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /embed/exchange:
    post:
      summary: Exchange one-time embed token
      tags: [Embed]
      operationId: embedTokenExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedTokenExchangeRequest'
      responses:
        '200': { description: Session established, content: { application/json: { schema: { $ref: '#/components/schemas/EmbedSession' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit/events:
    get:
      summary: Query audit events
      tags: [Audit]
      operationId: auditEventsQuery
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: action_type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invitations/accept:
    post:
      summary: Accept an invitation and activate account
      tags: [Users]
      operationId: invitationAccept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token, password]
              properties:
                invitation_token: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: User activated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /feature-flags:
    get:
      summary: List feature flags
      tags: [FeatureFlags]
      operationId: featureFlagsList
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Flags, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create or update feature flag
      tags: [FeatureFlags]
      operationId: featureFlagUpsert
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag_key, status]
              properties:
                flag_key: { type: string }
                status: { type: string, enum: [enabled, disabled] }
                rollout_rules: { type: object }
      responses:
        '201': { description: Created }
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /feature-flags/{flag_key}:
    get:
      summary: Get feature flag
      tags: [FeatureFlags]
      operationId: featureFlagGet
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: flag_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlag' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete feature flag
      tags: [FeatureFlags]
      operationId: featureFlagDelete
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: flag_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /config/export:
    get:
      summary: Export redacted configuration descriptor
      tags: [Config]
      operationId: configExport
      responses:
        '200': { description: Config export, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/token/revoke:
    post:
      summary: Revoke tokens (access or refresh)
      tags: [Auth]
      operationId: authTokenRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                type: { type: string, enum: [access, refresh], default: refresh }
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/token/revocations:
    get:
      summary: List recent token revocations (admin)
      tags: [Auth]
      operationId: authTokenRevocationsList
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Revocations, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { jti: { type: string }, revoked_at: { type: string, format: date-time } } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /policies/dry-run:
    post:
      summary: Evaluate policies in dry-run (no side effects)
      tags: [Policy]
      operationId: policyDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, attributes]
              properties:
                resource_type: { type: string }
                attributes: { type: object }
      responses:
        '200': { description: Evaluation result, content: { application/json: { schema: { type: object, properties: { decision: { type: string, enum: [ALLOW, DENY, ABSTAIN] }, rationale: { type: string } } } } } }
        '400': { $ref: '#/components/responses/StandardError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health:
    get:
      summary: Health & status including migration and key rotation version
      tags: [System]
      operationId: healthStatus
      security: []
      responses:
        '200': 
          description: OK
          content: 
            application/json: 
              schema: 
                type: object
                required: [status, migrations_applied, key_rotation_version]
                properties: 
                  status: 
                    type: string
                    enum: [ok]
                    description: Overall health status
                  migrations_applied: 
                    type: boolean
                    description: Whether database migrations are applied
                  key_rotation_version: 
                    type: integer
                    description: Current key rotation version

  /config:
    get:
      summary: Export configuration snapshot
      tags: [System]
      operationId: exportConfig
      security: []
      responses:
        '200':
          description: Configuration export
          content:
            application/json:
              schema:
                type: object
                properties:
                  APP_NAME:
                    type: string
                  PASSWORD_MIN_LENGTH:
                    type: integer
                  PASSWORD_COMPLEXITY_STRICT:
                    type: boolean

  /config/errors:
    get:
      summary: Get configuration validation errors
      tags: [System]
      operationId: configErrors
      security: []
      responses:
        '200':
          description: Configuration errors list
