openapi: 3.1.0
info:
  title: Observability & Export API (Fragment)
  version: 0.1.0-draft
  description: >-
    Observability fragment (logs export, metrics snapshot, redaction rules). Shared securitySchemes
    defined in base fragment; not duplicated here to reduce maintenance overhead.
servers:
  - url: https://api.example.com/api/v1
  - url: http://localhost:8000/api/v1
    description: Local Dev
security:
  - bearerAuth: []
components:
  schemas:
    ExportRequest:
      type: object
      properties:
        format: { type: string, enum: [jsonl, parquet] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        cursor: { type: string }
        level: { type: string, enum: [debug, info, warn, error], description: Minimum log level filter }
        redact: { type: boolean, default: true, description: Whether to apply redaction (false for privileged roles) }
    ExportStatus:
      type: object
      required: [export_id, state]
      properties:
        export_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, running, completed, failed, expired] }
        expires_at: { type: string, format: date-time }
        total_files: { type: integer }
        generated_files: { type: integer }
        download_urls:
          type: array
          items: { type: string, format: uri }
          description: Present when state=completed and files available
    MetricsSnapshot:
      type: object
      properties:
        collected_at: { type: string, format: date-time }
        counters: { type: object }
        gauges: { type: object }
        histograms: { type: object }
    RedactionRule:
      type: object
      properties:
        pattern_id: { type: string }
        description: { type: string }
        strategy: { type: string, enum: [hash, mask, redact] }
paths:
  /logs/exports:
    post:
      summary: Initiate structured log export
      tags: [Logs]
      operationId: logExportInitiate
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } }
      responses:
        '202': { description: Export accepted }
        '400': { description: Invalid parameters }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '429': { description: Rate limited }
  /logs/exports/{export_id}:
    get:
      summary: Get export status
      tags: [Logs]
      operationId: logExportStatus
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/ExportStatus' } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not Found }
  /metrics/snapshot:
    get:
      summary: Return a point-in-time metrics snapshot (bounded)
      tags: [Metrics]
      operationId: metricsSnapshot
      responses:
        '200': { description: Snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/MetricsSnapshot' } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /redaction/rules:
    get:
      summary: List active redaction rules (safe subset)
      tags: [Redaction]
      operationId: redactionRulesList
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RedactionRule' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
