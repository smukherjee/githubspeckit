# Configuration Descriptor (FR-039, FR-041, FR-043)
#
# Purpose: Single source of truth for all environment variables.
# Generates: .env.example file for documentation
# Validation: Enforced at startup (fail-fast on missing required keys)
# Hash: Computed excluding secrets (C-037, FR-043)
#
# Schema:
#   [section.VARIABLE_NAME]
#   type = "string" | "int" | "bool" | "float"
#   required = true | false
#   secret = true | false
#   default = <value> (optional)
#   description = "Human-readable description"
#   scope = "backend" | "frontend" | "shared" | "infra"

# ============================================================================
# Application Core
# ============================================================================

[app.APP_NAME]
type = "string"
required = true
secret = false
default = "githubspeckit-backend"
description = "Application name for logging and observability"
scope = "backend"

[app.OTEL_EXPORTER_OTLP_ENDPOINT]
type = "string"
required = false
secret = false
description = "OpenTelemetry OTLP exporter endpoint (if set, uses OTLP; otherwise console)"
scope = "backend"

[app.ENVIRONMENT]
type = "string"
required = true
secret = false
default = "development"
description = "Environment name (development, staging, production)"
scope = "backend"

[app.DEBUG]
type = "bool"
required = false
secret = false
default = false
description = "Enable debug mode (verbose logging, error details in responses)"
scope = "backend"

[app.LOG_LEVEL]
type = "string"
required = false
secret = false
default = "INFO"
description = "Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)"
scope = "backend"

# ============================================================================
# Database Configuration (Phase 3)
# ============================================================================

[database.DATABASE_URL]
type = "string"
required = false
secret = true
default = "sqlite+aiosqlite:///./dev_infysight.db"
description = "Database connection URL (default: SQLite for local dev; set env var for PostgreSQL/production)"
scope = "backend"

[database.DB_POOL_SIZE]
type = "int"
required = false
secret = false
default = 10
description = "Database connection pool size"
scope = "backend"

[database.DB_MAX_OVERFLOW]
type = "int"
required = false
secret = false
default = 20
description = "Maximum overflow connections beyond pool size"
scope = "backend"

[database.DB_POOL_TIMEOUT]
type = "int"
required = false
secret = false
default = 30
description = "Connection pool timeout in seconds"
scope = "backend"

[database.DB_SLOW_QUERY_THRESHOLD_MS]
type = "int"
required = false
secret = false
default = 100
description = "Threshold in milliseconds for slow query logging (FR-034, FR-074, IMPL-DB-09)"
scope = "backend"

[database.DB_ECHO_SQL]
type = "bool"
required = false
secret = false
default = false
description = "Echo SQL queries to stdout (development only)"
scope = "backend"

# ============================================================================
# Authentication & Security
# ============================================================================

[auth.SECRET_KEY]
type = "string"
required = true
secret = true
description = "Secret key for JWT signing and session management"
scope = "backend"

[auth.PASSWORD_MIN_LENGTH]
type = "int"
required = true
secret = false
default = 12
description = "Minimum password length (C-001, FR-009)"
scope = "backend"

[auth.PASSWORD_COMPLEXITY_STRICT]
type = "bool"
required = true
secret = false
default = false
description = "Enforce strict password complexity rules (uppercase, lowercase, digit, special)"
scope = "backend"

[auth.JWT_ALGORITHM]
type = "string"
required = false
secret = false
default = "HS256"
description = "JWT signing algorithm"
scope = "backend"

[auth.JWT_ACCESS_TOKEN_EXPIRE_MINUTES]
type = "int"
required = false
secret = false
default = 60
description = "Access token expiration in minutes"
scope = "backend"

[auth.JWT_REFRESH_TOKEN_EXPIRE_DAYS]
type = "int"
required = false
secret = false
default = 30
description = "Refresh token expiration in days"
scope = "backend"

# ============================================================================
# Rate Limiting (FR-046-054, Phase 3.6)
# ============================================================================

[rate_limiting.RATE_LIMIT_ENABLED]
type = "bool"
required = false
secret = false
default = true
description = "Enable rate limiting"
scope = "backend"

[rate_limiting.RATE_LIMIT_PER_MINUTE]
type = "int"
required = false
secret = false
default = 60
description = "Default rate limit (requests per minute per user)"
scope = "backend"

[rate_limiting.RATE_LIMIT_USER_CREATION]
type = "int"
required = false
secret = false
default = 100
description = "Rate limit for user creation endpoint (requests per hour per IP, FR-046)"
scope = "backend"

[rate_limiting.REDIS_URL]
type = "string"
required = false
secret = true
default = "redis://localhost:6379/1"
description = "Redis URL for distributed rate limiting (uses database 1, distinct from session storage)"
scope = "backend"

# ============================================================================
# Observability
# ============================================================================

[observability.OTEL_ENABLED]
type = "bool"
required = false
secret = false
default = false
description = "Enable OpenTelemetry tracing and metrics"
scope = "backend"

[observability.OTEL_ENDPOINT]
type = "string"
required = false
secret = false
description = "OpenTelemetry collector endpoint (e.g., http://localhost:4318)"
scope = "backend"

[observability.METRICS_ENABLED]
type = "bool"
required = false
secret = false
default = true
description = "Enable Prometheus metrics endpoint"
scope = "backend"

[observability.METRICS_PORT]
type = "int"
required = false
secret = false
default = 9090
description = "Prometheus metrics endpoint port"
scope = "backend"

# ============================================================================
# CORS & Security Headers
# ============================================================================

[security.CORS_ORIGINS]
type = "string"
required = false
secret = false
default = "*"
description = "Comma-separated list of allowed CORS origins"
scope = "backend"

[security.ALLOWED_HOSTS]
type = "string"
required = false
secret = false
default = "*"
description = "Comma-separated list of allowed host headers"
scope = "backend"

# ============================================================================
# Testing (Phase 3)
# ============================================================================

[testing.TEST_DATABASE_URL]
type = "string"
required = false
secret = true
default = "postgresql+asyncpg://postgres:postgres@localhost:5432/githubspeckit_test"
description = "Test database connection URL"
scope = "backend"

# ============================================================================
# Photo Storage (FR-003-user-profile-details)
# ============================================================================

[photo_storage.STORAGE_TYPE]
type = "string"
required = false
secret = false
default = "local"
description = "Photo storage backend type (local or s3)"
scope = "backend"

[photo_storage.LOCAL_BASE_PATH]
type = "string"
required = false
secret = false
default = "data/photos"
description = "Base path for local file storage (relative to project root)"
scope = "backend"

[photo_storage.S3_BUCKET]
type = "string"
required = false
secret = false
default = ""
description = "S3 bucket name for photo storage (production only)"
scope = "backend"

[photo_storage.S3_REGION]
type = "string"
required = false
secret = false
default = ""
description = "AWS region for S3 bucket"
scope = "backend"

[photo_storage.S3_ACCESS_KEY_ID]
type = "string"
required = false
secret = true
default = ""
description = "AWS access key ID for S3 (set in production)"
scope = "backend"

[photo_storage.S3_SECRET_ACCESS_KEY]
type = "string"
required = false
secret = true
default = ""
description = "AWS secret access key for S3 (set in production)"
scope = "backend"

[photo_storage.MAX_UPLOAD_SIZE_MB]
type = "int"
required = false
secret = false
default = 10
description = "Maximum allowed file size for photo uploads in megabytes"
scope = "backend"

# ============================================================================
# Session Management (FR-004-tenant-security-refactor)
# ============================================================================

[session.BACKEND]
type = "string"
required = false
secret = false
default = "cookie"
description = "Session storage backend type (cookie for dev, redis for production)"
scope = "backend"

[session.SECRET_KEY]
type = "string"
required = true
secret = true
description = "Secret key for session encryption (must be 32+ characters)"
scope = "backend"

[session.TTL]
type = "int"
required = false
secret = false
default = 3600
description = "Session time-to-live in seconds (default: 1 hour)"
scope = "backend"

[session.REDIS_URL]
type = "string"
required = false
secret = true
default = "redis://localhost:6379/0"
description = "Redis connection URL for session storage (production only)"
scope = "backend"

# ============================================================================
# Feature Deprecation (FR-004-tenant-security-refactor)
# ============================================================================

[deprecation.TENANT_QUERY_PARAM_SUNSET]
type = "string"
required = false
secret = false
default = "2025-11-19"
description = "Sunset date for tenant_id query parameter support (ISO 8601 format)"
scope = "backend"

