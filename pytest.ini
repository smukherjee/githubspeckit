[pytest]
addopts = -ra --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml
pythonpath = src
asyncio_mode = auto
markers =
    contract: OpenAPI contract test
    db: Database integration tests (slow, requires DB)
    postgres_only: Tests that only run with PostgreSQL (e.g., pg_type queries, enum types)
    sqlite_only: Tests that only run with SQLite
    integration: Integration tests that test multiple components together
    performance: Performance and load tests
    security: Security-focused tests (OWASP, IDOR, etc.)

[coverage:run]
source = src
omit = 
    */tests/*
    */conftest.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
# V1.0 coverage thresholds (adjusted for 71 skipped tests - deferred features)
precision = 2
skip_covered = False
skip_empty = True
fail_under = 85.0

# Show lines that need coverage
show_missing = True

[coverage:html]
directory = htmlcov
